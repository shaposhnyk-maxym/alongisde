name: Alongside
options:
  bundleIdPrefix: com.alongside
configs:
  Debug: debug
  # Product > Archive always builds with whatever configuration the scheme's ArchiveAction names
  # (XcodeGen's own scheme default is "Release") - without a real Release config here, that name
  # doesn't exist in the project at all, and the build system's fallback behavior for the
  # different targets/SPM packages disagrees on what to build, breaking archive with a stray
  # "no such file" for a Debug-path resource bundle (confirmed live 2026-08-06).
  Release: release
# Secrets.xcconfig is gitignored (docs/local-setup.md) - GOOGLE_PLACES_API_KEY/GEMINI_API_KEY,
# the iOS equivalent of local.properties. Substituted into Generated-Info.plist below. Applied to
# both configs - Release needs the same keys at runtime as Debug, there's no separate prod secrets
# file.
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.2.0
# XcodeGen doesn't autocreate scheme files for us (confirmed live 2026-08-06 - a bare `xcodegen
# generate` produced zero .xcscheme files anywhere). The ShareExtension scheme that existed before
# was one Xcode itself created ad hoc in the editor, and every subsequent `generate` silently wiped
# it without recreating it. Declared explicitly here so both schemes survive every regenerate.
schemes:
  Alongside:
    build:
      targets:
        Alongside: all
    run:
      config: Debug
    archive:
      config: Release
  ShareExtension:
    build:
      targets:
        ShareExtension: all
        Alongside: all
    run:
      # Share Extensions can't launch themselves - `askForAppToLaunch` makes Xcode prompt for a
      # host app (e.g. Maps) on every Run, which is the only way to get the debugger/console
      # attached to the extension's own process (confirmed live 2026-08-06 - this is what finally
      # surfaced ShareViewController's os.Logger output instead of just the main app's).
      config: Debug
      askForAppToLaunch: true
targets:
  Alongside:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alongside.max
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone-only, not universal - the Compose UI has never been laid out/tested for iPad,
        # and declaring iPad support (TARGETED_DEVICE_FAMILY "1,2", Xcode's default) requires
        # UISupportedInterfaceOrientations for iPad multitasking, which App Store Connect
        # validation rejects the archive without (confirmed live 2026-08-06). "1" opts out of
        # the iPad requirement entirely instead of just satisfying it for a form factor the app
        # was never designed for.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Free "Personal Team" (no paid Apple Developer Program needed for Simulator work) -
        # required for real code signing, which GTMAppAuth/GIDSignIn need for Keychain access
        # (keychain-access-group is tied to the team ID; an unsigned/empty-team build makes every
        # Keychain read/write fail immediately - confirmed live as "provider failure - keychain
        # error"). See docs/roadmap.md / [[ios-apple-dev-account-blocked]] - that blocker is only
        # about APNs + long-lived physical-device testing, not this. Whichever Apple ID's Personal
        # Team this is, it must actually be signed into Xcode > Settings > Accounts on the
        # machine building this project - "Automatic" signing silently falls back to "Sign to Run
        # Locally" (which strips ALL entitlements, including this one) if the team ID below isn't
        # a currently signed-in account, with no build error - confirmed live 2026-07-30.
        # Switched from KZKC9CNZ73 to ZNR5YK2QVJ 2026-08-06 - the former had no active Xcode
        # Accounts session anymore ("No Account for Team" signing error), the latter does.
        DEVELOPMENT_TEAM: ZNR5YK2QVJ
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework app"
    entitlements:
      path: Generated-Alongside.entitlements
      properties:
        # Shared with ShareExtension so the extension can hand a shared URL/text off to the main
        # app (docs/roadmap.md M7) - the extension runs as a separate process, this is the only
        # channel between them.
        com.apple.security.application-groups:
          - group.com.alongside.max
    prebuildScripts:
      - name: Build KMP framework (Gradle)
        script: |
          cd "$SRCROOT/.."
          ./gradlew :app:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Alongside
        UILaunchScreen: {}
        # Required by Compose Multiplatform's ComposeUIViewController sanity check - without it,
        # the app throws kotlin.IllegalStateException and aborts on launch (confirmed live).
        CADisableMinimumFrameDurationOnPhone: true
        # Real GIDSignIn wiring (M7's Google Sign-In half) - same Firebase project
        # (alongside-b05f2) as Android's `default_web_client_id`. GIDClientID lets GIDSignIn
        # auto-configure without a GoogleService-Info.plist (we don't use the Firebase SDK - ADR
        # #3); the URL scheme is required for the OAuth redirect to come back into the app.
        GIDClientID: 965813009948-3eevg32ptnnth9kdtit8sin87tg0oq1r.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.965813009948-3eevg32ptnnth9kdtit8sin87tg0oq1r
        # Required for PHPhotoLibrary.requestAuthorizationForAccessLevel - missing this key
        # crashes with NSInvalidArgumentException on the real call (M7's IosPermissionController).
        # No equivalent key is needed for UNUserNotificationCenter's authorization request.
        NSPhotoLibraryUsageDescription: "Alongside turns your camera roll into a shared diary with your partner."
        # Substituted at build time from Secrets.xcconfig (gitignored) - read at runtime via
        # NSBundle.mainBundle in MainViewController.kt, mirroring Android's local.properties ->
        # BuildConfig -> androidAppModule(...) parameter pattern.
        GooglePlacesAPIKey: $(GOOGLE_PLACES_API_KEY)
        GeminiAPIKey: $(GEMINI_API_KEY)

  ShareExtension:
    type: app-extension
    platform: iOS
    # Deliberately no dependency on the `app` KMP framework/Koin/Compose - extensions are
    # separate, memory-constrained processes; this stays plain Swift/UIKit (docs/roadmap.md M7).
    sources:
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alongside.max.ShareExtension
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZNR5YK2QVJ
    entitlements:
      path: Generated-ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.alongside.max
    info:
      path: Generated-ShareExtension-Info.plist
      properties:
        CFBundleDisplayName: Alongside
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
